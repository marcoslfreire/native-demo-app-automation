stages:
  - validate

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  GITHUB_REPOSITORY_URL: "https://github.com/marcoslfreire/native-demo-app-automation.git"

cache:
  paths:
    - .npm/

validate_project:
  stage: validate
  image: node:24-bookworm

  before_script:
    - node --version
    - npm --version
    - git --version
    - rm -rf github-source
    - git clone --depth 1 "$GITHUB_REPOSITORY_URL" github-source
    - cd github-source
    - echo "Commit do GitHub utilizado na validacao:"
    - git rev-parse HEAD
    - npm ci

  script:
    - npx wdio --version
    - npx appium --version
    - test -f wdio.base.conf.js
    - test -f Dockerfile
    - test -f .dockerignore
    - test -d test/features
    - test -d test/step-definitions
    - test -d test/pages
    - echo "Validacao da estrutura e das ferramentas concluida com sucesso."

  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_MERGE_REQUEST_IID'