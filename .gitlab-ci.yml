stages:
  - validate
  - test

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  GITHUB_REPOSITORY_URL: "https://github.com/marcoslfreire/native-demo-app-automation.git"

cache:
  paths:
    - .npm/

validate_project:
  stage: validate
  image: node:24-bookworm

  before_script:
    - node --version
    - npm --version
    - git --version
    - |
      if [ "$CI_PIPELINE_SOURCE" = "trigger" ]; then
        echo "Obtendo commit enviado pelo webhook do GitHub..."
        GITHUB_SHA=$(node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync(process.env.TRIGGER_PAYLOAD, 'utf8')); console.log(p.after)")
      else
        echo "Execução manual: obtendo o commit atual da branch main do GitHub..."
        GITHUB_SHA=$(git ls-remote "$GITHUB_REPOSITORY_URL" refs/heads/main | cut -f1)
      fi
      echo "Commit do GitHub utilizado:"
      echo "$GITHUB_SHA"
    - rm -rf github-source
    - git clone "$GITHUB_REPOSITORY_URL" github-source
    - cd github-source
    - git checkout "$GITHUB_SHA"
    - echo "Commit efetivamente validado:"
    - git rev-parse HEAD
    - npm ci

  script:
    - npx wdio --version
    - npx appium --version
    - test -f wdio.base.conf.js
    - test -f wdio.android.browserstack.conf.js
    - test -f Dockerfile
    - test -f .dockerignore
    - test -d test/features
    - test -d test/step-definitions
    - test -d test/pages
    - echo "Validacao da estrutura e das ferramentas concluida com sucesso."

  rules:
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

test_android_browserstack:
  stage: test
  image: node:24-bookworm

  before_script:
    - node --version
    - npm --version
    - git --version
    - |
      if [ "$CI_PIPELINE_SOURCE" = "trigger" ]; then
        echo "Obtendo commit enviado pelo webhook do GitHub..."
        GITHUB_SHA=$(node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync(process.env.TRIGGER_PAYLOAD, 'utf8')); console.log(p.after)")
      else
        echo "Execução manual: obtendo o commit atual da branch main do GitHub..."
        GITHUB_SHA=$(git ls-remote "$GITHUB_REPOSITORY_URL" refs/heads/main | cut -f1)
      fi
      echo "Commit do GitHub utilizado:"
      echo "$GITHUB_SHA"
    - rm -rf github-source
    - git clone "$GITHUB_REPOSITORY_URL" github-source
    - cd github-source
    - git checkout "$GITHUB_SHA"
    - echo "Commit efetivamente executado:"
    - git rev-parse HEAD
    - npm ci

  script:
    - echo "Iniciando testes Android no BrowserStack..."
    - npx wdio wdio.android.browserstack.conf.js

  artifacts:
    when: always
    paths:
      - github-source/allure-results/
      - github-source/relatorio/
    expire_in: 7 days

  rules:
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
    - if: '$CI_PIPELINE_SOURCE == "web"'